name: sampaathi
description: "Sampathi News - Enterprise Kannada Digital News Portal"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Navigation & State
  flutter_riverpod: ^2.4.9
  go_router: ^13.2.0

  # Networking & HTTP
  dio: ^5.4.0

  # UI and Styling
  google_fonts: ^6.1.0
  responsive_framework: ^1.1.1
  shimmer: ^3.0.0
  cached_network_image: ^3.3.1
  flutter_animate: ^4.5.0

  # Helpers & Utilities
  shared_preferences: ^2.2.2
  intl: ^0.19.0
  universal_html: ^2.2.4
  file_picker: ^8.0.0+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  # Asset management for logo and images if needed
  assets:
    - assets/images/
